<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width">
    <title>recorder</title>
</head>

<body>
    <div>
        <button id="getUserMedia">カメラ</button>
        <button id="getDisplayMedia">画面収録</button>
        <button id="start">開始</button>
        <button id="stop" disabled>停止</button>
        <button id="download">ダウンロード</button>
    </div>
    <div>
        <video id="video" autoplay muted playsinline></video>
    </div>
    <div>
        <video id="preview" controls></video>
    </div>
    <script>
        let recorder;
        let recordData = [];
        const startButton = document.querySelector('#start');
        const stopButton = document.querySelector('#stop');
        document.querySelector('#getUserMedia').addEventListener('click', () => getMedia(false));
        document.querySelector('#getDisplayMedia').addEventListener('click', () => getMedia(true));
        startButton.addEventListener('click', e => {
            recordData = [];
            recorder.start();
            e.preventDefault();
            startButton.toggleAttribute('disabled');
            stopButton.toggleAttribute('disabled');
        }, false);
        stopButton.addEventListener('click', () => {
            recorder.stop();
            startButton.toggleAttribute('disabled');
            stopButton.toggleAttribute('disabled');
        });
        document.querySelector('#download').addEventListener('click', () => {
            if (!recordData.length) {
                return;
            }
            const blob = new Blob(recordData, {
                type: recorder.mimeType
            });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            const digit = '2-digit';
            a.download = `${new Date().toLocaleString('ja-JP', {
                year: 'numeric',
                month: digit,
                day: digit,
                hour: digit,
                minute: digit,
                second: digit
            }).replaceAll(/[^\d]/g, '')}.webm`;
            a.click();
            setTimeout(() => URL.revokeObjectURL(url), 1000);
        });

        function getMedia(isDisplayMedia) {
            const mediaDevices = navigator.mediaDevices;
            const media = isDisplayMedia ? mediaDevices.getDisplayMedia({
                video: {
                    displaySurface: 'browser',
                },
                audio: {
                    suppressLocalAudioPlayback: false,
                },
                preferCurrentTab: false,
                selfBrowserSurface: 'exclude',
                systemAudio: 'include',
                surfaceSwitching: 'include',
                monitorTypeSurfaces: 'include',
            }) : mediaDevices.getUserMedia({
                video: {
                    facingMode: 'environment',
                },
                audio: true
            });
            media.then(stream => {
                const video = document.querySelector('#video');
                video.srcObject = stream;
                video.play();
                recorder = new MediaRecorder(stream);
                recorder.ondataavailable = e => {
                    if (e.data.size > 0) {
                        recordData.push(e.data);
                    }
                };
                recorder.onstop = () => {
                    const blob = new Blob(recordData, {
                        type: recorder.mimeType
                    });
                    const preview = document.querySelector('#preview');
                    preview.src = URL.createObjectURL(blob);
                    preview.load();
                    preview.onloadedmetadata = () => {
                        preview.width = video.videoWidth;
                        preview.height = video.videoHeight;
                        preview.play();
                    };
                };
            });
        }
    </script>
</body>

</html>
