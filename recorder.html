<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width">
    <title>recorder</title>
</head>

<body>
    <div>
        <button id="start">開始</button>
        <button id="stop" disabled>停止</button>
        <button id="download">ダウンロード</button>
    </div>
    <div>
        <video id="video" autoplay muted playsinline></video>
    </div>
    <div>
        <video id="preview" controls></video>
    </div>
    <script>
        let recorder;
        let recordData = [];
        const video = document.querySelector('#video');
        const startButton = document.querySelector('#start');
        const stopButton = document.querySelector('#stop');
        const downloadButton = document.querySelector('#download');
        const preview = document.querySelector('#preview');
        getMedia(false).then(stream => new Promise(resolve => {
            video.srcObject = stream;
            video.play();
            recorder = new MediaRecorder(stream);
            recorder.ondataavailable = resolve;
        })).then(e => {
            preview.width = video.videoWidth;
            preview.height = video.videoHeight;
            recordData.push(e.data);
            preview.src = URL.createObjectURL(e.data);
        });
        startButton.addEventListener('click', e => {
            recordData = [];
            recorder.start();
            e.preventDefault();
            startButton.toggleAttribute('disabled');
            stopButton.toggleAttribute('disabled');
        }, false);
        stopButton.addEventListener('click', () => {
            recorder.stop();
            console.log(recorder.mimeType);
            startButton.toggleAttribute('disabled');
            stopButton.toggleAttribute('disabled');
        });
        downloadButton.addEventListener('click', () => {
            if (!recordData.length) {
                return;
            }
            const blob = new Blob(recordData, { type: 'video/mp4' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            const digit = '2-digit';
            a.href = url;
            a.download = `${new Date().toLocaleString('ja-JP', {
                year: 'numeric',
                month: digit,
                day: digit,
                hour: digit,
                minute: digit,
                second: digit
            }).replaceAll(/[^\d]/g, '')}.mp4`;
            a.click();
            URL.revokeObjectURL(url);
        });

        function getMedia(isDisplayMedia) {
            const mediaDevices = navigator.mediaDevices;
            if (isDisplayMedia) {
                return mediaDevices.getDisplayMedia({
                    video: {
                        displaySurface: 'browser',
                    },
                    audio: {
                        suppressLocalAudioPlayback: false,
                    },
                    preferCurrentTab: false,
                    selfBrowserSurface: 'exclude',
                    systemAudio: 'include',
                    surfaceSwitching: 'include',
                    monitorTypeSurfaces: 'include',
                })
            } else {
                return mediaDevices.getUserMedia({
                    video: {
                        facingMode: 'environment',
                    },
                    audio: true
                })
            }
        }
    </script>
</body>

</html>
