<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0">
  <title>Text Editor</title>
  <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/github-markdown-css/5.5.1/github-markdown.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/abcjs@6.5.2/abcjs-audio.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://unpkg.com/mermaid/dist/mermaid.min.js"></script>
  <script src="https://cdn.mathjax.org/mathjax/latest/MathJax.js?config=TeX-AMS-MML_HTMLorMML"></script>
  <script src="https://cdn.jsdelivr.net/npm/abcjs@6.5.2/dist/abcjs-basic-min.min.js"></script>
  <style>
    textarea {
      font-size: 16px;
    }
  </style>
</head>

<body>
  <div>
    <select>
      <option>Markdown</option>
      <option>Mermaid</option>
      <option>LaTeX</option>
      <option>ABC</option>
    </select>
    <input id="import" type="file">
    <button id="export">出力</button>
    <button id="export-html">HTML出力</button>
  </div>
  <textarea id="textarea"></textarea>
  <div id="result" class="markdown-body mermaid"></div>
  <script>
    mermaid.initialize({ startOnLoad: false });
    let fileName = '';
    const select = document.querySelector('select');
    const textarea = document.querySelector('textarea');
    const result = document.querySelector('.markdown-body.mermaid');
    textarea.style.width = `${innerWidth}px`;
    textarea.style.height = `${innerHeight / 2}px`;
    textarea.addEventListener('input', async () => {
      try {
        const value = textarea.value;
        result.innerHTML = null;
        result.style = null;
        switch (select.value) {
          case 'Markdown':
            result.innerHTML = marked.parse(value);
            hljs.highlightAll();
            break;
          case 'Mermaid':
            delete result.dataset.processed;
            result.textContent = value;
            await mermaid.run();
            break;
          case 'LaTeX':
            result.innerHTML = value.replaceAll('\n', '<br>');
            MathJax.Hub.Typeset(result);
            break;
          case 'ABC':
            new ABCJS.Editor('textarea', { canvas_id: 'result' });
            break;
        }
      } catch (error) {
        result.textContent = JSON.stringify(error);
      }
    });
    select.addEventListener('change', () => textarea.dispatchEvent(new Event('input')));
    document.querySelector('#import').addEventListener('change', e => {
      const file = e.target.files[0];
      fileName = file.name;
      const reader = new FileReader();
      reader.onload = () => {
        textarea.value = reader.result;
        textarea.dispatchEvent(new Event('input'));
      };
      reader.readAsText(file);
    });
    document.querySelector('#export').addEventListener('click', () => {
      fileName = prompt('ファイル名', fileName);
      if (fileName) {
        const blob = new Blob([textarea.value], { type: 'text/plain' });
        const a = document.createElement('a');
        const url = URL.createObjectURL(blob);
        a.href = url;
        a.download = fileName;
        a.click();
        URL.revokeObjectURL(url);
      }
    });
    document.querySelector('#export-html').addEventListener('click', () => {
      const pos = fileName.lastIndexOf('.');
      const title = pos > 0 ? fileName.substring(0, pos) : fileName;
      const htmlFileName = prompt('ファイル名', `${title}.html`);
      if (htmlFileName) {
        const html = document.createElement('html');
        const head = document.createElement('head');
        const meta1 = document.createElement('meta');
        meta1.setAttribute('charset', 'UTF-8');
        head.append(meta1);
        const meta2 = document.createElement('meta');
        meta2.name = 'viewport';
        meta2.content = 'width=device-width, initial-scale=1.0, viewport-fit=cover';
        head.append(meta2);
        const titleElement = document.createElement('title');
        titleElement.textContent = title;
        head.append(titleElement);
        const link1 = document.createElement('link');
        link1.rel = 'stylesheet';
        link1.href = 'https://cdnjs.cloudflare.com/ajax/libs/github-markdown-css/5.5.1/github-markdown.min.css';
        head.append(link1);
        const link2 = document.createElement('link');
        link2.rel = 'stylesheet';
        link2.href = 'https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css';
        head.append(link2);
        html.append(head);
        const body = document.createElement('body');
        body.innerHTML = result.outerHTML;
        html.append(body);
        const blob = new Blob([`<!DOCTYPE html>\n${html.outerHTML}`], { type: 'text/html' });
        const a = document.createElement('a');
        const url = URL.createObjectURL(blob);
        a.href = url;
        a.download = htmlFileName.endsWith('.html') ? htmlFileName : `${htmlFileName}.html`;
        a.click();
        URL.revokeObjectURL(url);
      }
    });
  </script>
</body>

</html>
