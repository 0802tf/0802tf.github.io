<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width">
    <title>OCR</title>
    <script src='https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js'></script>
</head>

<body>
    <input id="file" type="file" accept="image/*" multiple>
    <button id="trim">trim</button>
    <button id="export">保存</button>
    <textarea></textarea>
    <div id="image"></div>
    <dialog>
        <div id="status"></div>
        <progress value="0" max="1"></progress>
    </dialog>
    <script>
        const dialog = document.querySelector('dialog');
        const textarea = document.querySelector('textarea');
        document.querySelector('#file').addEventListener('change', async e => {
            textarea.value = '';
            const files = e.target.files;
            for (const file of files) {
                await new Promise((resolve, reject) => {
                    const reader = new FileReader();
                    reader.onload = resolve;
                    reader.onerror = reject;
                    reader.readAsDataURL(file);
                }).then(e => {
                    const img = document.createElement('img');
                    img.src = e.target.result;
                    img.width = innerWidth / 2;
                    document.querySelector('#image').append(img);
                    dialog.showModal();
                    return Tesseract.recognize(img, ['eng', 'jpn'], {
                        logger: m => {
                            document.querySelector('#status').textContent = m.status;
                            document.querySelector('progress').value = m.progress;
                        },
                        errorHandler: alert
                    });
                }).then(result => {
                    textarea.value += `${result.data.text}\n`;
                    dialog.close();
                }).catch(alert);
            }
        });
        document.querySelector('#trim').addEventListener('click', () => textarea.value = textarea.value.trim().replaceAll(' ', ''));
        textarea.style.width = `${innerWidth}px`;
        textarea.style.height = `${innerHeight / 2}px`;
        textarea.addEventListener('focus', () => textarea.select());
        document.querySelector('#export').addEventListener('click', () => {
            const text = textarea.value;
            const firstText = text.substring(0, text.indexOf('\n'));
            const fileName = prompt('ファイル名', `${firstText}.txt`);
            if (fileName) {
                const blob = new Blob([text], { type: 'text/plain' });
                const link = document.createElement('a');
                const url = URL.createObjectURL(blob);
                link.href = url;
                link.download = fileName;
                link.click();
                URL.revokeObjectURL(url);
            }
        });
    </script>
</body>

</html>
